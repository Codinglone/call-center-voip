name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Lint with ruff
        run: ruff check orchestrator/ chatbots/ shared/ --ignore B008 || true
      - name: Type check with mypy
        run: mypy orchestrator/ chatbots/ shared/ --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -v || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Asterisk image
        run: docker build -t asterisk-test ./asterisk
      - name: Build Orchestrator image
        run: docker build -t orchestrator-test ./orchestrator || true
      - name: Build English bot image
        run: docker build -t english-bot-test ./chatbots/english || true
      - name: Build Kinyarwanda bot image
        run: docker build -t kinyarwanda-bot-test ./chatbots/kinyarwanda || true
