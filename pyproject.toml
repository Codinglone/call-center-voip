[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SipForge"
version = "0.1.0"
description = "Distributed voice communication platform with AI-powered chatbots"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "voip",
    "asterisk",
    "sip",
    "chatbot",
    "voice",
    "ai",
    "kinyarwanda",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/Codinglone/SipForge"
Repository = "https://github.com/Codinglone/SipForge"
Documentation = "https://github.com/Codinglone/SipForge#readme"
Issues = "https://github.com/Codinglone/SipForge/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["orchestrator", "chatbots", "shared"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
